@if (isOpen) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-neutral-900/50 p-4 backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title"
    (click)="close()"
  >
    <section
      class="max-h-[90vh] w-full max-w-2xl overflow-hidden rounded-md border border-border bg-surface"
      (click)="$event.stopPropagation()"
    >
      <header class="flex items-center justify-between gap-4 border-b border-border bg-neutral-100 px-6 py-3">
        <div class="min-w-0">
          <p class="mb-1 text-xs font-semibold tracking-widest text-blue-700">Pré-visualização</p>
          <h2 class="truncate font-semibold text-slate-900">{{ title }}</h2>
        </div>
        <button
          type="button"
          class="flex size-9 shrink-0 items-center justify-center rounded-md text-slate-500 transition hover:bg-slate-200 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
          (click)="close()"
          aria-label="Fechar modal"
        >
          <span aria-hidden="true" class="text-xl leading-none">&times;</span>
        </button>
      </header>

      <div class="max-h-[calc(90vh-5rem)] overflow-y-auto p-4">
        <ng-content />
      </div>
    </section>
  </div>
}
