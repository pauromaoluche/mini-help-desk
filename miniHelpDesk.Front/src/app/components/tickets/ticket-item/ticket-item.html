<td class="px-4 py-3">
  <div class="font-medium">{{ ticket.title }}</div>
  <div class="text-xs text-neutral-500">#{{ ticket.id }}</div>
</td>
<td class="px-3 py-3">{{ ticket.priority }}</td>
<td class="px-3 py-3">{{ ticket.status }}</td>
<td class="px-3 py-3">{{ ticket.assignee ?? 'Sem responsável' }}</td>
<td class="px-3 py-3">
  <div class="flex items-center gap-2">
    <div class="h-1.5 flex-1 rounded-full bg-neutral-200">
      <div class="h-full rounded-full bg-gh-blue" [style.width.%]="ticket.progress"></div>
    </div>
    <span class="text-xs">{{ ticket.progress }}%</span>
  </div>
</td>
<td class="px-4 py-3 text-right">—</td>
