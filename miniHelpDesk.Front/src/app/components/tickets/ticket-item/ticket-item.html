<td class="px-4 py-3">
  <div class="font-semibold hover:text-blue-700 hover:underline">{{ ticket.title }}</div>
  <div class="text-xs text-neutral-500">#{{ ticket.id }}</div>
</td>
<td class="px-3 py-3">{{ priorities[ticket.priority] ?? ticket.priority }}</td>
<td class="px-3 py-3">{{ statuses[ticket.status] ?? ticket.status }}</td>
<td class="px-3 py-3" [ngClass]="{ 'text-neutral-500 italic': !ticket.assignedToId }">{{ ticket.assignedToId ? '#' + ticket.assignedToId : 'Sem responsável' }}</td>
<td class="px-3 py-3 text-neutral-500">—</td>
<td class="px-4 py-3 text-right">—</td>
