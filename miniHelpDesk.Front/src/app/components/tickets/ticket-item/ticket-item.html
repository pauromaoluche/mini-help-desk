<td class="px-4 py-3">
  <div class="font-semibold hover:text-blue-700 hover:underline">{{ ticket.title }}</div>
  <div class="text-xs text-neutral-500">#{{ ticket.id }}</div>
</td>
<td class="px-3 py-3">{{ priorities[ticket.priority] ?? ticket.priority }}</td>
<td class="px-3 py-3">{{ statuses[ticket.status] ?? ticket.status }}</td>
<td class="px-3 py-3" [ngClass]="{ 'text-muted italic': !ticket.assignedToId }">{{ ticket.assignedToId ? '#' + ticket.assignedToId : 'Sem responsável' }}</td>
<td class="px-3 py-3 text-muted">—</td>
<td class="px-4 py-3 text-right">
  <button
    type="button"
    class="rounded-md border border-border px-3 py-1.5 hover:bg-neutral-50"
    (click)="preview.emit(ticket)"
  >
    Preview
  </button>
</td>
